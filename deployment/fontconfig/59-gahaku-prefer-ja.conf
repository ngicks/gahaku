<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Pins Noto CJK to its Japanese faces; see the Dockerfile for why. -->
<fontconfig>
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Noto Sans CJK SC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans CJK TC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans CJK HK</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans CJK KR</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif CJK SC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif CJK TC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif CJK HK</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif CJK KR</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Mono CJK SC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Mono CJK TC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Mono CJK HK</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Mono CJK KR</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif Mono CJK SC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif Mono CJK TC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif Mono CJK HK</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif Mono CJK KR</string></patelt></pattern>
    </rejectfont>
  </selectfont>
  <match target="pattern">
    <test name="family"><string>MS Mincho</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>MS PMincho</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>ＭＳ 明朝</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>ＭＳ Ｐ明朝</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Yu Mincho</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>游明朝</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Hiragino Mincho ProN</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>MS Gothic</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>MS PGothic</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>MS UI Gothic</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>ＭＳ ゴシック</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>ＭＳ Ｐゴシック</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Yu Gothic</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>游ゴシック</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Meiryo</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>メイリオ</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Hiragino Kaku Gothic ProN</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans Mono CJK JP</string></edit>
  </match>
</fontconfig>
